[build-system]
requires = ["setuptools>=77"]  # 77+ reads the SPDX `license` string below.
build-backend = "setuptools.build_meta"

[project]
name = "pandalyzer"
version = "0.1.0"
description = "Schema-agnostic CSV loading, profiling and cleaning built on pandas"
readme = "README.md"
license = "MIT"
authors = [{ name = "4m4teur" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas>=2.2",  # Tested in CI on 2.2, 2.3 and 3.x.
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.coverage.run]
source = ["autoclean"]
branch = true

[tool.coverage.report]
show_missing = true


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
